<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D szoba – eredeti modell, látvány módok</title><style>html,body{height:100%;margin:0;background:#111;color:white;font-family:system-ui}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}#panel{position:fixed;z-index:5;bottom:12px;left:50%;transform:translateX(-50%);width:max-content;max-width:94vw;background:#171b20ed;padding:10px;border-radius:12px;box-shadow:0 4px 22px #0008}button{border:1px solid #777;border-radius:8px;background:#343a43;color:#fff;padding:9px;margin:2px}button[aria-pressed=true]{background:#bd9164;color:#111}small{display:block;color:#ddd;margin:4px 3px}#room.day{filter:brightness(1.12) saturate(1.05)}#room.warm{filter:sepia(.22) saturate(1.12) brightness(.93)}#room.soft{filter:brightness(1.06) contrast(.9)}</style></head><body><iframe id="room" src="./index.html" title="Eredeti forgatható 3D-s szobamodell"></iframe><div id="panel"><strong>Eredeti 3D-s szoba · látvány módok</strong><div><button data-mode="" aria-pressed="true">Eredeti</button><button data-mode="day" aria-pressed="false">Nappali</button><button data-mode="warm" aria-pressed="false">Esti</button><button data-mode="soft" aria-pressed="false">Lágy</button></div><small>Az eredeti modell változatlan. A módok képi színszűrők, nem valódi új fényforrások.</small></div><script>const f=document.querySelector('#room');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{f.className=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))})</script></body></html>
