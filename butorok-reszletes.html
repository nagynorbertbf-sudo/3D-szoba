<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D szoba – bútorok részletes vizsgálata</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui;background:#171b21;color:white}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}#panel{position:fixed;z-index:9;bottom:8px;left:50%;transform:translateX(-50%);width:min(96vw,650px);background:#18202af2;border:1px solid #687681;border-radius:14px;padding:11px;box-shadow:0 8px 28px #0009}button{border:1px solid #7a8793;background:#354451;color:#fff;border-radius:8px;padding:8px;margin:3px;font-size:12px}button.active{background:#d6ae7d;color:#181818}#status,small{font-size:11px;color:#d2dce3}#status{color:#e9cba3;margin:7px 3px}.head{display:flex;align-items:center;justify-content:space-between}.hidden .body{display:none}.group{font-size:12px;font-weight:700;margin-top:7px}</style></head><body><iframe id="room" src="./index.html" title="Eredeti méretarányos szobamodell"></iframe><div id="panel"><div class="head"><strong>3D szoba · bútorok</strong><button id="toggle">Panel elrejtése</button></div><div class="body"><div class="group">Bútor kiemelése</div><div id="furniture"><button data-focus="all" class="active">Teljes szoba</button><button data-focus="bed">AMI DM1 ágy</button><button data-focus="wardrobe">P&B szekrény</button><button data-focus="desk">Kraken asztal</button><button data-focus="dresser">Malaga komód</button><button data-focus="shelves">Thal polc</button></div><div class="group">Anyagok megjelenítése</div><div><button data-material="original" class="active">Eredeti</button><button data-material="matte">Matt felületek</button><button data-material="soft">Lágy kárpitfény</button><button data-material="defined">Részletesebb kontúrok</button></div><div id="status">Modell betöltése…</div><small>A kiemelés a többi 3D felületet áttetszővé teszi, nem mozgat bútort. A felületi fények vizuális közelítések, nem valódi szövet- vagy famintás textúrák.</small></div></div><script>
const frame=document.querySelector('iframe'),status=document.getElementById('status');let graph,original={},focus='all',material='original';
const groups={bed:/AMI DM1|Fejtámla|Matrac|Ágytakaró|Ágykeret|Ágyneműtartó|kárpit|ágytakaró/i,wardrobe:/P&B|Tolóajtó/i,desk:/Kraken|TRIADA/i,dresser:/Malaga/i,shelves:/Thal/i};
const lights={matte:{ambient:.78,diffuse:.75,specular:.055,roughness:.97,fresnel:.02},soft:{ambient:.84,diffuse:.67,specular:.11,roughness:.9,fresnel:.04},defined:{ambient:.68,diffuse:.89,specular:.24,roughness:.69,fresnel:.08}};
function get(){try{const w=frame.contentWindow,g=[...w.document.querySelectorAll('.js-plotly-plot')].find(x=>x.data?.length);if(g){graph=g;return g}}catch(e){}return null}
function label(t){return (t.hovertemplate||t.name||'').replace(/<.*$/s,'')}
function init(){const g=get();if(!g)return false;g.data.forEach((t,i)=>{original[i]={opacity:t.opacity,lighting:t.lighting?{...t.lighting}:null,line:t.line?{...t.line}:null}});status.textContent='Készen áll: '+g.data.length+' eredeti modellréteg. Válassz bútort.';return true}
frame.addEventListener('load',()=>{let n=0;const interval=setInterval(()=>{if(init()||++n>50)clearInterval(interval)},300)});
async function apply(){const g=get();if(!g){status.textContent='A modell még töltődik.';return}const w=frame.contentWindow;const ids=[],opacity=[],lighting=[],lineWidths=[];let matches=0;
g.data.forEach((t,i)=>{if(t.type!=='mesh3d'&&t.type!=='scatter3d')return;const hit=focus==='all'||groups[focus].test(label(t));if(hit&&focus!=='all')matches++;ids.push(i);opacity.push(focus==='all'||hit?(original[i]?.opacity??1):(t.type==='mesh3d'?.13:.09));lighting.push(t.type==='mesh3d'?(material==='original'?(original[i]?.lighting||{}):lights[material]):undefined);lineWidths.push(t.type==='scatter3d'?(material==='defined'&&hit?Math.max(3,original[i]?.line?.width||2):(original[i]?.line?.width||2)):undefined)});
try{await w.Plotly.restyle(g,{opacity},ids);const meshIds=ids.filter(i=>g.data[i].type==='mesh3d');if(meshIds.length)await w.Plotly.restyle(g,{lighting:meshIds.map(i=>material==='original'?(original[i]?.lighting||{}):lights[material])},meshIds);const lineIds=ids.filter(i=>g.data[i].type==='scatter3d'&&g.data[i].mode?.includes('lines'));if(lineIds.length)await w.Plotly.restyle(g,{'line.width':lineIds.map(i=>material==='defined'?Math.max(3,original[i]?.line?.width||2):(original[i]?.line?.width||2))},lineIds);status.textContent=focus==='all'?'Teljes szoba visszaállítva.':matches+' bútorrészlet kiemelve. Az eredeti geometria változatlan.'}catch(e){status.textContent='Megjelenítési hiba: '+e.message}}
document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{focus=b.dataset.focus;document.querySelectorAll('[data-focus]').forEach(x=>x.classList.toggle('active',x===b));apply()});
document.querySelectorAll('[data-material]').forEach(b=>b.onclick=()=>{material=b.dataset.material;document.querySelectorAll('[data-material]').forEach(x=>x.classList.toggle('active',x===b));apply()});
document.getElementById('toggle').onclick=()=>{const p=document.getElementById('panel');p.classList.toggle('hidden');document.getElementById('toggle').textContent=p.classList.contains('hidden')?'Panel megnyitása':'Panel elrejtése'};
</script></body></html>
