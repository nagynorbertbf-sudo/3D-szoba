<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Szoba – 3D látványterv (mobil javítás)</title><style>body{margin:0;background:#101318;color:white;font:14px system-ui}#ui{position:absolute;z-index:2;top:12px;left:12px;background:#15191ddd;padding:12px;border-radius:12px;max-width:300px}button{background:#343c46;color:white;border:1px solid #69717c;border-radius:7px;padding:9px;margin:3px}small{color:#c5cbd1}canvas{display:block}</style></head><body><div id="ui"><b>3D szoba – látványterv v2</b><div><button id="overview">Felülnézet</button><button id="door">Ajtóból</button><button id="walls">Falak ki/be</button></div><small>Ujjal forgatható és nagyítható. Méretek cm-ben, az eredeti alaprajz szerint. A bútorfrontok részletei szemléltető jellegűek. Új: famintázat, ágynemű, bútorfogantyúk, szegélyek és finomabb világítás.</small></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#cbd0d2');
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.01,50);camera.position.set(3.8,4.5,5.9);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.45;document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(1.45,.65,2.05);controls.enableDamping=true;controls.maxPolarAngle=Math.PI/2.02;controls.update();
function woodTexture(){const c=document.createElement('canvas');c.width=256;c.height=512;const g=c.getContext('2d');g.fillStyle='#b18a64';g.fillRect(0,0,256,512);for(let i=0;i<650;i++){let x=Math.random()*256,y=Math.random()*512;g.strokeStyle=i%3?'rgba(58,34,18,.08)':'rgba(255,235,194,.11)';g.lineWidth=.3+Math.random()*1.5;g.beginPath();g.moveTo(x,y);g.bezierCurveTo(x+Math.random()*8,y+30,x-Math.random()*8,y+90,x+Math.random()*3,y+130);g.stroke()}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,5);t.colorSpace=THREE.SRGBColorSpace;return t}
const grain=woodTexture();const timber=new THREE.MeshStandardMaterial({map:grain,roughness:.78});

// mattress seam, padded headboard panels and bedding

box(.12,.59,1.86,.55,.065,.35,white);box(.12,.59,2.40,.55,.065,.35,white);

for(let i=0;i<3;i++){box(.418,.12+i*.18,3.36,.009,.17,.38,oak);box(.428,.18+i*.18,3.49,.009,.009,.13,metal)}box(.418,.1,2.97,.009,.6,.36,anth);
// Thal corner unit: back diagonal 60cm and front 114cm, 36cm inset
const q=Math.sqrt(2),rearA=new THREE.Vector2(2.9-.6/q,4.1),rearB=new THREE.Vector2(2.9,4.1-.6/q);
const mid=rearA.clone().add(rearB).multiplyScalar(.5);const frontMid=mid.clone().add(new THREE.Vector2(-.36/q,-.36/q));
const v=new THREE.Vector2(1/q,-1/q);const p1=frontMid.clone().sub(v.clone().multiplyScalar(.57)),p2=frontMid.clone().add(v.clone().multiplyScalar(.57));
const shape=new THREE.Shape();shape.moveTo(rearA.x,rearA.y);shape.lineTo(rearB.x,rearB.y);shape.lineTo(p2.x,p2.y);shape.lineTo(p1.x,p1.y);shape.closePath();const geo=new THREE.ExtrudeGeometry(shape,{depth:.5,bevelEnabled:false});geo.rotateX(-Math.PI/2);geo.translate(0,.5,0);const unit=new THREE.Mesh(geo,oak);unit.castShadow=true;unit.receiveShadow=true;scene.add(unit);

scene.add(new THREE.HemisphereLight(0xe5f3ff,0x796452,2.2));const sun=new THREE.DirectionalLight(0xffedcf,3.3);sun.position.set(-2,5,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-7;sun.shadow.camera.right=7;sun.shadow.camera.top=7;sun.shadow.camera.bottom=-7;scene.add(sun);

</script></body></html>
