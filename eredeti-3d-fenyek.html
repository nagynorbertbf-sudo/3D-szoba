<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eredeti 3D szoba – részletes világítás</title><style>html,body{margin:0;height:100%;font-family:system-ui;background:#14171b}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}#panel{position:fixed;z-index:10;bottom:10px;left:50%;transform:translateX(-50%);box-sizing:border-box;width:min(96vw,530px);padding:11px;background:#1a1f25ed;color:white;border-radius:13px;box-shadow:0 5px 24px #0007}button{padding:9px;border-radius:8px;border:1px solid #777;color:white;background:#39424b;margin:3px;font-size:13px}button.active{background:#b99770;color:#191919}small{display:block;color:#d0d3d7;font-size:11px;margin:5px 3px}#status{font-size:11px;color:#e1c9a5}</style></head><body><iframe id="room" src="./index.html" title="Eredeti méretarányos 3D szoba"></iframe><div id="panel"><strong>3D szoba · eredeti modell + fények</strong><div><button data-mode="original" class="active">Eredeti</button><button data-mode="day">Nappali</button><button data-mode="evening">Esti</button><button data-mode="soft">Lágy</button></div><div id="status">Az eredeti szobamodell betöltése…</div><small>A bútorok és méretek változatlanok. A fénybeállítások a 3D felületeken működnek; nem fotórealisztikus renderelés.</small></div><script>
const frame=document.getElementById('room'),status=document.getElementById('status');
const presets={day:{ambient:.82,diffuse:.85,specular:.18,roughness:.78,fresnel:.05},evening:{ambient:.58,diffuse:.68,specular:.26,roughness:.76,fresnel:.08},soft:{ambient:.92,diffuse:.43,specular:.08,roughness:.92,fresnel:.03}};
let graph=null,original=[];
function locate(){try{const w=frame.contentWindow;return [...w.document.querySelectorAll('.js-plotly-plot')].find(g=>g.data&&g.data.length)}catch(e){status.textContent='Nem sikerült elérni a 3D nézetet: '+e.message;return null}}
async function apply(mode){graph=locate();if(!graph){status.textContent='A 3D modell még töltődik. Próbáld meg pár másodperc múlva.';return}
const w=frame.contentWindow;const ids=[],lights=[];graph.data.forEach((t,i)=>{if(t.type==='mesh3d'){ids.push(i);if(!original[i])original[i]={...(t.lighting||{})};lights.push(mode==='original'?original[i]:presets[mode])}});
try{if(ids.length)await w.Plotly.restyle(graph,{lighting:lights},ids);status.textContent=ids.length+' darab 3D felület világítása frissítve.';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}catch(e){status.textContent='Nem sikerült alkalmazni: '+e.message}}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>apply(b.dataset.mode)));
frame.addEventListener('load',()=>{status.textContent='Modell betöltve. Válassz világítást.'});
</script></body></html>
