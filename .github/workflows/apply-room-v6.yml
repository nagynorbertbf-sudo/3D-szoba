name: Apply room v6 patch on test branch
on:
  push:
    branches: [szoba-v6-teszt]
    paths: [szoba_v6_frissites.json.gz]
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: szoba-v6-teszt
      - name: Apply verified v6 patch
        run: python szoba_v6_frissites_alkalmazasa.py
      - name: Commit updated room only to test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Apply room v6 model patch"
          git push origin HEAD:szoba-v6-teszt
