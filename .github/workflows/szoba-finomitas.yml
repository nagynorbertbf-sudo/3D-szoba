
name: 3D szoba finomitas

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-room:
    if: github.ref == 'refs/heads/szoba-v6-teszt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Finomitas
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          changes = [
              (
                  '"line":{"color":"#4b4d52","width":2}',
                  '"line":{"color":"#666970","width":3}',
                  3
              ),
              (
                  '"color":"#b8c7cc","flatshading":true,',
                  '"color":"#c9d8df","flatshading":true,',
                  1
              )
          ]

          for old, new, expected in changes:
              count = html.count(old)
              if count != expected:
                  raise SystemExit(
                      f"Ellenorzes sikertelen: {count}/{expected}"
                  )
              html = html.replace(old, new)

          path.write_text(html, encoding="utf-8")
          print("A finomitas sikerult.")
          PY

      - name: Valtozasok mentese
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || \
            git commit -m "3D szoba elso finomitasa"
          git push
