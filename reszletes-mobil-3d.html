<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>3D szoba – részletes mobilnézet</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#14171c;color:#fff;font-family:system-ui,sans-serif}iframe{width:100%;height:100%;border:0;background:#fff}#toolbar{position:fixed;z-index:9;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));background:#192028f0;border:1px solid #66717b;border-radius:14px;padding:10px;box-shadow:0 6px 28px #0008;max-width:680px;margin:auto}#toolbar.minimized .body{display:none}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:650}.head button{font-size:12px}.body{margin-top:8px}.row{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}button{background:#35414d;color:white;border:1px solid #75808a;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer}button.active{background:#d4aa79;color:#141414;border-color:#d4aa79}button:disabled{opacity:.45}small{font-size:11px;color:#c6d0d8}#status{font-size:11px;color:#e8c9a2;margin:5px 0}.section{font-size:12px;font-weight:600;color:#d7e1ea;margin-top:8px}
</style></head><body><iframe id="room" src="./index.html" title="Eredeti 3D szobamodell"></iframe>
<div id="toolbar"><div class="head"><span>3D szoba · részletes mobilnézet</span><button id="collapse">Panel elrejtése</button></div><div class="body">
<div class="section">Kameraállások</div><div class="row" id="views">
<button data-view="entry">Bejárat</button><button data-view="window">Ablak</button><button data-view="bed">Ágy</button><button data-view="desk">Asztal</button><button data-view="top">Felülnézet</button></div>
<div class="section">3D felületi fények</div><div class="row" id="lights"><button data-light="original" class="active">Eredeti</button><button data-light="day">Nappali</button><button data-light="evening">Esti</button><button data-light="soft">Lágy</button></div>
<div class="section">Részletek és megjelenítés</div><div class="row"><button id="walls">Falak elrejtése</button><button id="screenshot">Kép mentése</button><button id="fullscreen">Teljes képernyő</button></div>
<div id="status">A szobamodell betöltése…</div><small>Az eredeti bútorok, pozíciók, méretek és a szobamodell változatlanok. A falak kapcsolása csak a megjelenítést érinti. A fények nem fotórealisztikus sugárkövetésen alapulnak.</small>
</div></div>
<script>
const frame=document.getElementById('room'),status=document.getElementById('status');
let gd=null,originalLighting={},hiddenWalls=false,wallIndices=[],lightMode='original';
const cams={entry:{x:1.2,y:-1.85,z:1.15},window:{x:-1.25,y:1.85,z:1.15},bed:{x:1.85,y:.15,z:1.12},desk:{x:1.45,y:-1.35,z:1.15},top:{x:.005,y:-.005,z:2.8}};
const presets={day:{ambient:.84,diffuse:.82,specular:.16,roughness:.8,fresnel:.05},evening:{ambient:.58,diffuse:.67,specular:.24,roughness:.77,fresnel:.07},soft:{ambient:.9,diffuse:.48,specular:.08,roughness:.9,fresnel:.03}};
function plot(){try{const w=frame.contentWindow;const g=[...w.document.querySelectorAll('.js-plotly-plot')].find(e=>e.data&&e.data.length);if(g){gd=g;return g}}catch(e){}return null}
function init(){const g=plot();if(!g)return false;wallIndices=[];g.data.forEach((t,i)=>{if(t.type==='mesh3d')originalLighting[i]={...(t.lighting||{})};if(/(?:^|\s)(fal|falak|mennyezet|mennyezetlap)(?:\s|$)/i.test(t.name||''))wallIndices.push(i)});status.textContent='Betöltve: '+g.data.length+' eredeti 3D elem. Forgatáshoz húzd a képet.';return true}
frame.addEventListener('load',()=>{let tries=0;const timer=setInterval(()=>{if(init()||++tries>45)clearInterval(timer)},350)});
async function ready(){if(gd&&gd.data)return gd;if(init())return gd;status.textContent='A modell még töltődik, próbáld újra rövidesen.';return null}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=async()=>{const g=await ready();if(!g)return;const eye=cams[b.dataset.view];await frame.contentWindow.Plotly.relayout(g,{'scene.camera':{eye,up:{x:0,y:0,z:1},projection:{type:'perspective'}}});document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));status.textContent='Kameranézet beállítva.'});
document.querySelectorAll('[data-light]').forEach(b=>b.onclick=async()=>{const g=await ready();if(!g)return;const ids=[],values=[];g.data.forEach((t,i)=>{if(t.type==='mesh3d'){ids.push(i);values.push(b.dataset.light==='original'?originalLighting[i]:presets[b.dataset.light])}});try{await frame.contentWindow.Plotly.restyle(g,{lighting:values},ids);lightMode=b.dataset.light;document.querySelectorAll('[data-light]').forEach(x=>x.classList.toggle('active',x===b));status.textContent=ids.length+' eredeti 3D felület világítása módosítva.'}catch(e){status.textContent='Világítási hiba: '+e.message}});
document.getElementById('walls').onclick=async e=>{const g=await ready();if(!g)return;if(!wallIndices.length){status.textContent='Nem található külön kapcsolható fal a modellben.';return}hiddenWalls=!hiddenWalls;await frame.contentWindow.Plotly.restyle(g,{visible:hiddenWalls?'legendonly':true},wallIndices);e.target.textContent=hiddenWalls?'Falak visszaállítása':'Falak elrejtése';status.textContent=wallIndices.length+' falréteg megjelenítése módosítva.'};
document.getElementById('screenshot').onclick=async()=>{const g=await ready();if(!g)return;try{await frame.contentWindow.Plotly.downloadImage(g,{format:'png',width:1280,height:900,filename:'3d-szoba-latvany'});status.textContent='Képmentés indítva.'}catch(e){status.textContent='Képmentési hiba: '+e.message}};
document.getElementById('fullscreen').onclick=()=>{const target=document.documentElement;if(!document.fullscreenElement&&target.requestFullscreen)target.requestFullscreen().catch(()=>status.textContent='A böngésző nem engedélyezi a teljes képernyőt.');else if(document.exitFullscreen)document.exitFullscreen()};
document.getElementById('collapse').onclick=()=>{const p=document.getElementById('toolbar');p.classList.toggle('minimized');document.getElementById('collapse').textContent=p.classList.contains('minimized')?'Panel megnyitása':'Panel elrejtése'};
</script></body></html>
