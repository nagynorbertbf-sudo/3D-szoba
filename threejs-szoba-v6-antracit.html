<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D szoba – DM1 antracitszürke matrac v6</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#cbd1d4;font-family:system-ui}#stage{position:fixed;inset:0}#source{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}#panel{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:10;display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;pointer-events:none}button,#status{pointer-events:auto;background:#17232de8;color:white;border:1px solid #8797a3;border-radius:9px;padding:9px 11px;font:13px system-ui}button:active{background:#4c6170}#status{position:fixed;top:10px;left:10px;right:10px;bottom:auto;text-align:center;pointer-events:none;font-size:12px}#panel button{background:#233442eb}</style></head><body><div id="stage"></div><iframe id="source" src="./index.html" aria-hidden="true"></iframe><div id="status">A szoba eredeti 3D-adatait töltöm…</div><div id="panel"><button id="entrance">Bejárat</button><button id="window">Ablak</button><button id="top">Felülnézet</button><button id="plus">Zoom +</button><button id="minus">Zoom −</button></div><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
window.addEventListener('error',e=>{document.getElementById('status').textContent='Betöltési hiba: '+e.message});window.addEventListener('unhandledrejection',e=>{document.getElementById('status').textContent='Betöltési hiba: '+(e.reason?.message||e.reason)});const status=document.getElementById('status');const stage=document.getElementById('stage');const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.55;stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#d5d8dc');const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,2,2400);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.08;controls.target.set(145,85,205);controls.minDistance=90;controls.maxDistance=1100;controls.maxPolarAngle=Math.PI*.95;camera.position.set(390,310,-510);controls.update();
scene.add(new THREE.HemisphereLight('#eaf3ff','#756956',2.2));const sun=new THREE.DirectionalLight('#fff1df',3.1);sun.position.set(-120,700,60);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-550;sun.shadow.camera.right=550;sun.shadow.camera.top=550;sun.shadow.camera.bottom=-550;sun.shadow.camera.near=1;sun.shadow.camera.far=1400;sun.shadow.bias=-.00012;scene.add(sun);
function decode(v){if(Array.isArray(v))return v;if(v&&typeof v==='object'&&v.bdata){const raw=atob(v.bdata);const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));const b=bytes.buffer;const dt=v.dtype||'f8';const kind=dt.slice(0,1),size=Number(dt.slice(1));const out=[];const dv=new DataView(b);for(let i=0;i+size<=bytes.length;i+=size){let n;if(kind==='f')n=size===8?dv.getFloat64(i,true):dv.getFloat32(i,true);else if(kind==='u')n=size===1?dv.getUint8(i):size===2?dv.getUint16(i,true):dv.getUint32(i,true);else n=size===1?dv.getInt8(i):size===2?dv.getInt16(i,true):dv.getInt32(i,true);out.push(n)}return out}return Array.from(v||[])}
function material(color,kind){let c=new THREE.Color(color||'#aaaaaa');const opts={color:c,roughness:.82,metalness:0,side:THREE.DoubleSide};if(/tükör|mirror/i.test(kind)) {opts.metalness=.38;opts.roughness=.19}if(/üveg|ablak/i.test(kind)){opts.transparent=true;opts.opacity=.35;opts.roughness=.2}if(/padló/i.test(kind))opts.roughness=.96;return new THREE.MeshStandardMaterial(opts)}
function plotMesh(t){const x=decode(t.x),y=decode(t.y),z=decode(t.z),a=decode(t.i),b=decode(t.j),c=decode(t.k);if(!x.length||!a.length)return;const verts=new Float32Array(a.length*9);for(let q=0;q<a.length;q++){const ids=[a[q],b[q],c[q]];for(let j=0;j<3;j++){const k=ids[j],p=q*9+j*3;verts[p]=290-x[k];verts[p+1]=z[k];verts[p+2]=y[k]}}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(verts,3));g.computeVertexNormals();const name=(t.name||t.hovertemplate||'').replace(/<.*$/,'');const mesh=new THREE.Mesh(g,material(t.color,name));mesh.castShadow=!/padló|fal|ablak/i.test(name);mesh.receiveShadow=true;scene.add(mesh)}
function plotLine(t){const x=decode(t.x),y=decode(t.y),z=decode(t.z);if(x.length<2)return;const points=[];for(let i=0;i<x.length;i++){if(Number.isFinite(x[i])&&Number.isFinite(y[i])&&Number.isFinite(z[i]))points.push(new THREE.Vector3(290-x[i],z[i],y[i]));else if(points.length){addSegment(points,t);points.length=0}}if(points.length>1)addSegment(points,t)}
function addSegment(points,t){const g=new THREE.BufferGeometry().setFromPoints(points);const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:t.line?.color||'#777777',transparent:true,opacity:.8}));scene.add(l)}
function box(name,center,size,color,roughness=.92){const g=new THREE.BoxGeometry(...size);const m=new THREE.MeshStandardMaterial({color,roughness,metalness:0});const mesh=new THREE.Mesh(g,m);mesh.name=name;mesh.position.set(...center);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);return mesh}
function roundedBox(name,center,size,radius,color,roughness=.88){const [w,hh,d]=size;const shape=new THREE.Shape();const x=-w/2,y=-d/2,r=Math.min(radius,w/2-.1,d/2-.1);shape.moveTo(x+r,y);shape.lineTo(x+w-r,y);shape.quadraticCurveTo(x+w,y,x+w,y+r);shape.lineTo(x+w,y+d-r);shape.quadraticCurveTo(x+w,y+d,x+w-r,y+d);shape.lineTo(x+r,y+d);shape.quadraticCurveTo(x,y+d,x,y+d-r);shape.lineTo(x,y+r);shape.quadraticCurveTo(x,y,x+r,y);const g=new THREE.ExtrudeGeometry(shape,{depth:hh,bevelEnabled:true,bevelSegments:2,steps:1,bevelSize:.4,bevelThickness:.4,curveSegments:4});g.rotateX(-Math.PI/2);const mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color,roughness}));mesh.position.set(center[0],center[1]-hh/2,center[2]);mesh.castShadow=true;mesh.receiveShadow=true;mesh.name=name;scene.add(mesh);return mesh}
function bed(){// Original source x=1.7..207.7; rendered X=290-x. Bed occupies X 82.3..288.3, Z 170..295.
const cx=185.3,cz=232.5;
roundedBox('DM1 sima fekete ágyneműtartós ágykeret',[cx,20.5,cz],[206,40,125],.9,'#171719',.78);
const frame=box('DM1 lábazat finom árnyékrés',[cx,2,cz],[202,3,121],'#0b0c0d',.92);
box('DM1 egyenes vékony fejtámla',[284.3,40,cz],[8,80,125],'#111214',.86);
box('DM1 matrac sötét alsó perem',[180,44,cz],[188,8,116],'#292b2d',.96);
roundedBox('DM1 matrac antracitszürke textil',[180,52,cz],[187,15,115],2.1,'#424449',.96);
const seam=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(186,15.2,114)),new THREE.LineBasicMaterial({color:'#34363a',transparent:true,opacity:.32}));seam.position.set(180,52,cz);scene.add(seam);
}
let ready=false;async function init(){if(ready)return;const f=document.getElementById('source');let doc;try{doc=f.contentDocument}catch(e){status.textContent='Nem sikerült elérni az eredeti modell adatait.';return}const gd=doc?.querySelector('.js-plotly-plot');if(!gd||!gd.data?.length){setTimeout(init,500);return}ready=true;let count=0;for(let i=0;i<gd.data.length;i++){const t=gd.data[i];if(i===17)continue;const name=t.name||t.hovertemplate||'';if(/AMI DM1|Fejtámla|Matrac|Ágytakaró|Ágykeret|Ágyneműtartó|paplan|párna/i.test(name))continue;if(t.visible===false||t.visible==='legendonly')continue;try{if(t.type==='mesh3d'){plotMesh(t);count++}else if(t.type==='scatter3d'&&t.mode?.includes('lines'))plotLine(t)}catch(e){console.warn('trace',i,e)}}bed();status.textContent='Three.js · változatlan elrendezés · új DM1 ágy, ágynemű nélkül';setTimeout(()=>status.style.display='none',6000);const f2=document.getElementById('source');f2.style.display='none'}
document.getElementById('source').addEventListener('load',init);setTimeout(init,2000);
function view(pos,top=false){camera.up.set(0,top?0:1,top?1:0);camera.position.set(...pos);controls.target.set(145,85,205);controls.update()}document.getElementById('entrance').onclick=()=>view([420,270,-390]);document.getElementById('window').onclick=()=>view([-170,270,680]);document.getElementById('top').onclick=()=>view([145,850,205.01],true);document.getElementById('plus').onclick=()=>{camera.position.sub(controls.target).multiplyScalar(.78).add(controls.target);controls.update()};document.getElementById('minus').onclick=()=>{camera.position.sub(controls.target).multiplyScalar(1.28).add(controls.target);controls.update()};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script></body></html>
