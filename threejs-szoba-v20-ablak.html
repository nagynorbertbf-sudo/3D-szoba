function view(pos,top=false){camera.up.set(0,top?0:1,top?1:0);camera.position.set(...pos);controls.target.set(145,85,205);controls.update()}document.getElementById('entrance').onclick=()=>view([420,270,-390]);document.getElementById('window').onclick=()=>view([-170,270,680]);document.getElementById('top').onclick=()=>view([145,850,205.01],true);document.getElementById('plus').onclick=()=>{camera.position.sub(controls.target).multiplyScalar(.78).add(controls.target);controls.update()};document.getElementById('walls').onclick=()=>{wallsVisible=!wallsVisible;walls.forEach(w=>w.visible=wallsVisible);document.getElementById('walls').textContent=wallsVisible?'Falak elrejtése':'Falak mutatása'};let evening=false;document.getElementById('light').onclick=()=>{evening=!evening;sun.color.set(evening?'#ffca95':'#fff1df');sun.intensity=evening?1.35:2.55;daylightFill.intensity=evening?.25:.9;interiorBounce.intensity=evening?95:65;renderer.toneMappingExposure=evening?1.12:1.34;document.getElementById('light').textContent=evening?'Nappali fény':'Esti fény'};document.getElementById('minus').onclick=()=>{camera.position.sub(controls.target).multiplyScalar(1.28).add(controls.target);controls.update()};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(){requestAnimationFrame(animate);controls.update();if(wardrobeMirror){/* Reflector retains a stale frame when viewed from behind: hide its surface on the back side, leaving the neutral backing. */wardrobeMirror.visible=camera.position.x<226.2;}renderer.render(scene,camera)}animate();
</script></body></html>
