let ready=false;async function init(){if(ready)return;const f=document.getElementById('source');let doc;try{doc=f.contentDocument}catch(e){status.textContent='Nem sikerült elérni az eredeti modell adatait.';return}const gd=doc?.querySelector('.js-plotly-plot');if(!gd||!gd.data?.length){setTimeout(init,500);return}ready=true;let count=0;for(let i=0;i<gd.data.length;i++){const t=gd.data[i];if(i===17)continue;const name=t.name||t.hovertemplate||'';if(/AMI DM1|Fejtámla|Matrac|Ágytakaró|Ágykeret|Ágyneműtartó|paplan|párna|P&B|Tolóajtó|Malaga|komód|fiókfront/i.test(name))continue;if(t.visible===false||t.visible==='legendonly')continue;try{if(t.type==='mesh3d'){plotMesh(t);count++}else if(t.type==='scatter3d'&&t.mode?.includes('lines'))plotLine(t)}catch(e){console.warn('trace',i,e)}}bed();enhancedWardrobe();enhancedMalaga();status.textContent='Three.js · V40 · vezérlés és falikép';setTimeout(()=>status.style.display='none',6000);const f2=document.getElementById('source');f2.style.display='none'}
document.getElementById('source').addEventListener('load',init);setTimeout(init,2000);

// 50×50 cm portrait in a 5 cm matte-black surround, on the right wall opposite the bed.
const portraitGroup=new THREE.Group();portraitGroup.name='Falikép az ággyal szemben';portraitGroup.position.set(3.5,200,232.5);portraitGroup.rotation.y=Math.PI/2;scene.add(portraitGroup);
const frameMat=new THREE.MeshStandardMaterial({color:'#090909',roughness:.76});
const frameMesh=new THREE.Mesh(new THREE.BoxGeometry(60,60,3),frameMat);frameMesh.position.z=-1.5;portraitGroup.add(frameMesh);
const photoPlaceholder=new THREE.Mesh(new THREE.PlaneGeometry(50,50),new THREE.MeshBasicMaterial({color:'#424242',side:THREE.DoubleSide}));photoPlaceholder.position.z=.15;portraitGroup.add(photoPlaceholder);
function setPortrait(src){new THREE.TextureLoader().load(src,tex=>{tex.colorSpace=THREE.SRGBColorSpace;const m=photoPlaceholder.material;photoPlaceholder.material=new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide});m.dispose();status.textContent='Falikép betöltve · 50×50 cm + 5 cm fekete keret';status.style.display='block';setTimeout(()=>status.style.display='none',3000)},undefined,()=>{status.textContent='A fénykép nem tölthető be';status.style.display='block'})}
try{const saved=localStorage.getItem('szoba-falikep-v39');if(saved)setPortrait(saved);else{status.textContent='A fénykép ezen a böngészőn még nincs elmentve – koppints ide egyszer a kiválasztásához';status.style.display='block';status.style.pointerEvents='auto';status.style.cursor='pointer';status.onclick=()=>document.getElementById('photoFile').click()}}catch(e){}

document.getElementById('photoFile').addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const side=Math.min(img.width,img.height);const c=document.createElement('canvas');c.width=512;c.height=512;const ctx=c.getContext('2d');ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,512,512);const url=c.toDataURL('image/jpeg',.87);setPortrait(url);status.onclick=null;status.style.pointerEvents='none';try{localStorage.setItem('szoba-falikep-v39',url)}catch(e){}};img.src=reader.result};reader.readAsDataURL(file)});

let indoor=false,yaw=0,pitch=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function aim(){const d=new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch));camera.lookAt(camera.position.clone().add(d));}function enterIndoor(){setWalls(true);indoor=true;controls.enabled=false;camera.up.set(0,1,0);camera.position.set(145*modelScale,155*modelScale,55*modelScale);yaw=0;pitch=-.08;aim();document.getElementById('inside').textContent='Kilépés beltérből'}function leaveIndoor(){setWalls(false);indoor=false;controls.enabled=true;document.getElementById('inside').textContent='Beltéri kamera'}let lastPointer=null;renderer.domElement.addEventListener('pointerdown',e=>{if(!indoor||e.pointerType==='mouse')return;lastPointer={id:e.pointerId,x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!indoor||e.pointerType==='mouse'||!lastPointer||lastPointer.id!==e.pointerId)return;yaw-=(e.clientX-lastPointer.x)*.005;pitch=clamp(pitch-(e.clientY-lastPointer.y)*.004,-1.35,1.35);lastPointer.x=e.clientX;lastPointer.y=e.clientY;aim()});renderer.domElement.addEventListener('pointerup',()=>lastPointer=null);renderer.domElement.addEventListener('pointercancel',()=>lastPointer=null);function walk(direction){const step=direction*22*modelScale;camera.position.x=clamp(camera.position.x+Math.sin(yaw)*step,12*modelScale,278*modelScale);camera.position.z=clamp(camera.position.z+Math.cos(yaw)*step,12*modelScale,398*modelScale);aim()}const keys=new Set();let locked=false;let prev=performance.now();
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='escape'&&indoor){leaveIndoor();view([420,270,-390]);return}if(['w','a','s','d','shift','arrowup','arrowdown','arrowleft','arrowright'].includes(k)&&!e.ctrlKey&&!e.altKey&&!e.metaKey){keys.add(k);e.preventDefault()}});
document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());
renderer.domElement.addEventListener('click',()=>{if(indoor&&matchMedia('(pointer:fine)').matches&&!document.pointerLockElement)renderer.domElement.requestPointerLock?.()});
renderer.domElement.addEventListener('contextmenu',e=>{if(indoor)e.preventDefault()});
renderer.domElement.addEventListener('pointerdown',e=>{if(indoor&&e.button===2){e.preventDefault();if(document.pointerLockElement===renderer.domElement)document.exitPointerLock?.();}});
document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===renderer.domElement);
document.addEventListener('mousemove',e=>{if(!indoor||!locked)return;yaw-=e.movementX*.00125;pitch=clamp(pitch-e.movementY*.00125,-1.35,1.35);aim()});
const oldLeave=leaveIndoor;leaveIndoor=function(){keys.clear();if(document.pointerLockElement===renderer.domElement)document.exitPointerLock?.();oldLeave()};
function keyboardMove(dt){let f=Number(keys.has('w')||keys.has('arrowup'))-Number(keys.has('s')||keys.has('arrowdown'));let r=Number(keys.has('a')||keys.has('arrowleft'))-Number(keys.has('d')||keys.has('arrowright'));if(!f&&!r)return;const n=Math.hypot(f,r),speed=(keys.has('shift')?140:70)*modelScale*dt;if(indoor){camera.position.x=clamp(camera.position.x+(Math.sin(yaw)*f+Math.cos(yaw)*r)*speed/n,12*modelScale,278*modelScale);camera.position.z=clamp(camera.position.z+(Math.cos(yaw)*f-Math.sin(yaw)*r)*speed/n,12*modelScale,398*modelScale);aim()}else{const forward=new THREE.Vector3();camera.getWorldDirection(forward).normalize();const horizontal=new THREE.Vector3(forward.x,0,forward.z);if(horizontal.lengthSq()<.000001)horizontal.set(0,0,1);horizontal.normalize();const right=new THREE.Vector3(-horizontal.z,0,horizontal.x);const delta=forward.multiplyScalar(f*speed/n).add(right.multiplyScalar(-r*speed/n));camera.position.add(delta);controls.target.add(delta);controls.update()}}
renderer.domElement.addEventListener('wheel',e=>{if(!indoor)return;e.preventDefault();camera.fov=clamp(camera.fov+e.deltaY*.025,38,76);camera.updateProjectionMatrix()},{passive:false});
function view(pos,top=false){leaveIndoor();pos=pos.map(v=>v*modelScale);camera.up.set(0,top?0:1,top?1:0);camera.position.set(...pos);controls.target.set(145*modelScale,85*modelScale,205*modelScale);controls.update()}document.getElementById('inside').onclick=()=>{if(indoor){leaveIndoor();view([420,270,-390])}else enterIndoor()};document.getElementById('entrance').onclick=()=>view([420,270,-390]);document.getElementById('plus').onclick=()=>{if(indoor){walk(1);return}camera.position.sub(controls.target).multiplyScalar(.78).add(controls.target);controls.update()};function setWalls(show){wallsVisible=show;walls.forEach(w=>w.visible=show);document.getElementById('walls').textContent=show?'Falak elrejtése':'Falak mutatása'}document.getElementById('walls').onclick=()=>setWalls(!wallsVisible);let evening=false;document.getElementById('light').onclick=()=>{evening=!evening;sun.color.set(evening?'#ffca95':'#fff1df');sun.intensity=evening?1.35:2.55;daylightFill.intensity=evening?.25:.9;interiorBounce.intensity=evening?95:65;renderer.toneMappingExposure=evening?1.12:1.34;document.getElementById('light').textContent=evening?'Nappali fény':'Esti fény'};document.getElementById('minus').onclick=()=>{if(indoor){walk(-1);return}camera.position.sub(controls.target).multiplyScalar(1.28).add(controls.target);controls.update()};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(){requestAnimationFrame(animate);const now=performance.now();keyboardMove(Math.min((now-prev)/1000,.05));prev=now;if(!indoor)controls.update();if(wardrobeMirror){/* Reflector retains a stale frame when viewed from behind: hide its surface on the back side, leaving the neutral backing. */wardrobeMirror.visible=camera.position.x<226.2*modelScale;}renderer.render(scene,camera)}animate();
